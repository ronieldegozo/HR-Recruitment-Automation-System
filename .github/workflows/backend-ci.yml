name: Backend CI

on:
  push:
    branches:
      - backend_dev
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Maven + Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            Backend/pom.xml
            Backend/.mvn/wrapper/maven-wrapper.properties

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build production Docker image
        run: docker build --pull --tag recruitflow-backend:${{ github.sha }} .

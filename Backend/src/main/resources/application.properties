# Phase 2: read-only access to the existing Supabase Postgres table.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
quarkus.datasource.username=recruitflow_backend_readonly.wnoqqpmbtlljivyxjhkq
quarkus.datasource.password=${RECRUITFLOW_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=3

# Hibernate JSONB uses its built-in format mapper; no customized ObjectMapper is configured.
quarkus.hibernate-orm.mapping.format.global=ignore

# Never create, update, drop, or seed the existing Supabase schema/data.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

# Local development only; do not expose applicant services to the network.
quarkus.http.host=127.0.0.1
quarkus.http.port=8080

# Health endpoints are the only HTTP endpoints in Phase 2.

# Supabase Auth keys are optional for starting the backend; set them in the PowerShell session to use Auth endpoints.
supabase.auth.publishable-key=${SUPABASE_PUBLISHABLE_KEY:not-configured}
supabase.auth.admin-key=${SUPABASE_SERVICE_ROLE_KEY:not-configured}
quarkus.rest-client.supabase-auth.url=${SUPABASE_URL:https://wnoqqpmbtlljivyxjhkq.supabase.co}

# Validate Supabase-issued bearer tokens and map the trusted app_metadata role claim to Quarkus roles.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${SUPABASE_URL:https://wnoqqpmbtlljivyxjhkq.supabase.co}/auth/v1
quarkus.oidc.roles.role-claim-path=app_metadata/role
quarkus.oidc.token.audience=authenticated
quarkus.security.jaxrs.deny-unannotated-endpoints=true
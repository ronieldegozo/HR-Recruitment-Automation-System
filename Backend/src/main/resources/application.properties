# Phase 2: read-only access to the existing Supabase Postgres table.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
quarkus.datasource.username=recruitflow_backend_readonly.wnoqqpmbtlljivyxjhkq
quarkus.datasource.password=${RECRUITFLOW_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=3

# Hibernate JSONB uses its built-in format mapper; no customized ObjectMapper is configured.
quarkus.hibernate-orm.packages=org.hr.recruitmen.automation.model
quarkus.hibernate-orm.mapping.format.global=ignore

# Never create, update, drop, or seed the existing Supabase schema/data.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

# Local development defaults; Render overrides host and supplies its PORT environment variable.
quarkus.http.host=${QUARKUS_HTTP_HOST:127.0.0.1}
quarkus.http.port=${PORT:8080}

# Phase 2 and optional Phase 2.A database health, Phase 3 Auth/admin endpoints; applicant APIs remain out of scope.

# Supabase Auth keys are optional for starting the backend; set them in the PowerShell session to use Auth endpoints.
supabase.auth.publishable-key=${SUPABASE_PUBLISHABLE_KEY:not-configured}
supabase.auth.admin-key=${SUPABASE_SERVICE_ROLE_KEY:not-configured}
quarkus.rest-client.supabase-auth.url=${SUPABASE_URL:https://wnoqqpmbtlljivyxjhkq.supabase.co}

# Validate Supabase-issued bearer tokens and map the trusted app_metadata role claim to Quarkus roles.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${SUPABASE_URL:https://wnoqqpmbtlljivyxjhkq.supabase.co}/auth/v1
quarkus.oidc.roles.role-claim-path=app_metadata/role
quarkus.oidc.token.audience=authenticated
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Phase 2.A organization data uses a separate, least-privilege database login and persistence unit.
# It is inactive by default so existing read-only applicant features and readiness remain unchanged.
recruitflow.organization.db.enabled=${RECRUITFLOW_ORG_DB_ENABLED:false}
quarkus.datasource."organization".db-kind=postgresql
quarkus.datasource."organization".username=${RECRUITFLOW_ORG_DB_USERNAME:recruitflow_backend_org.wnoqqpmbtlljivyxjhkq}
quarkus.datasource."organization".password=${RECRUITFLOW_ORG_DB_PASSWORD:}
quarkus.datasource."organization".jdbc.url=${RECRUITFLOW_ORG_DB_JDBC_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
quarkus.datasource."organization".jdbc.max-size=3
quarkus.datasource."organization".active=${RECRUITFLOW_ORG_DB_ENABLED:false}
quarkus.datasource."organization".health-exclude=true
quarkus.hibernate-orm."organization".active=${RECRUITFLOW_ORG_DB_ENABLED:false}
quarkus.hibernate-orm."organization".datasource=organization
quarkus.hibernate-orm."organization".packages=org.hr.recruitmen.automation.organization.model
quarkus.hibernate-orm."organization".schema-management.strategy=none
quarkus.hibernate-orm."organization".sql-load-script=no-file
